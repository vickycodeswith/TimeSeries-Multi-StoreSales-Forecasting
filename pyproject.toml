[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "favorita-store-sales-prediction"
version = "0.1.0"
description = "Reusable forecasting utilities for the Corporacion Favorita sales dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
notebook = [
    "darts>=0.30,<1",
    "jupyter>=1.0,<2",
    "kaggle>=1.6,<2",
    "lightgbm>=4.0,<5",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
visualization = [
    "matplotlib>=3.7,<4",
]
modeling = [
    "scikit-learn>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
